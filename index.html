<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Thread Hiker — Passages</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f7f5f2;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; touch-action: none; }
  canvas { display: block; }
  .hud { position: fixed; color: #1e1c1a; user-select: none; pointer-events: none; }
  #title { top: 14px; left: 18px; font-size: 14px; letter-spacing: .12em; text-transform: uppercase;
    opacity: 0; transition: opacity 1s; }
  body.playing #title { opacity: 1; }
  #title b { font-weight: 700; } #title span { opacity: .45; }
  #credit { top: 40px; left: 18px; font-size: 11px; opacity: 0; text-align: left; line-height: 1.6;
    transition: opacity 1s; }
  body.playing #credit { opacity: .45; }
  #controls { top: 82px; left: 18px; font-size: 12px; opacity: 0; text-align: left; line-height: 1.7;
    transition: opacity 1s; }
  body.playing #controls { opacity: .55; }
  body.touch #controls { display: none; }

  /* splash */
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    padding-top: 14vh; gap: 12px; color: #1e1c1a; user-select: none;
    transition: opacity 1.1s; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash h1 { margin: 0; font-size: clamp(34px, 7vw, 62px); font-weight: 800;
    letter-spacing: .3em; text-indent: .3em; text-transform: uppercase; }
  #splash .sub { margin: 0; font-size: clamp(14px, 2.2vw, 18px); letter-spacing: .14em; opacity: .75; }
  #splash .cred { margin: 0; font-size: clamp(12px, 1.8vw, 14px); opacity: .55; }
  #splash .go { margin-top: 7vh; font-size: 13px; letter-spacing: .18em; text-transform: uppercase;
    animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }

  /* touch controls — one analog stick, circle within a circle */
  #stick { position: fixed; left: 22px; bottom: 22px; width: 140px; height: 140px;
    border-radius: 50%; background: #1e1c1a12; border: 1.5px solid #1e1c1a2b;
    display: none; touch-action: none; z-index: 5; }
  body.touch.playing #stick { display: block; }
  #nub { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px;
    border-radius: 50%; background: #1e1c1a3a; transform: translate(-50%, -50%); }
  #nub.recenter { transition: transform .15s ease-out; }
  #mapbtn { position: fixed; right: 20px; bottom: 20px; width: 50px; height: 50px;
    border-radius: 50%; background: #1e1c1a1c; color: #1e1c1a; display: none;
    align-items: center; justify-content: center; font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; touch-action: none; z-index: 5; }
  body.touch.playing #mapbtn { display: flex; }
</style>

<body>
<div class="hud" id="title"><b>Thread Hiker</b> · Passages &nbsp;<span>v0.22</span></div>
<div class="hud" id="credit">after “Passages Series” (2026)<br>fiber art by Steve Medwin</div>
<div class="hud" id="controls">W / S walk &nbsp;·&nbsp; A / D turn &nbsp;·&nbsp; M map</div>
<div id="splash">
  <h1>Thread Hiker</h1>
  <p class="sub">a walk inside “Passages”</p>
  <p class="cred">fiber art by Steve Medwin &nbsp;·&nbsp; medwinfiberart.com</p>
  <p class="go">press any key or tap to begin</p>
</div>
<div id="stick"><div id="nub"></div></div>
<div id="mapbtn">map</div>

<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

const COLORS = { red: 0xd04036, orange: 0xe89a2a, yellow: 0xe6cc39, green: 0x4aa848,
                 blue: 0x36a3d9, purple: 0xa98ad4, black: 0x2a2724 };

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;   // tone mapping happens in the post pass
document.body.appendChild(renderer.domElement);
const MAXANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf7f5f2);
scene.fog = new THREE.Fog(0xf7f5f2, 80, 210);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c8, 1.25));
const sun = new THREE.DirectionalLight(0xfff0dd, 2.6);
sun.position.set(42, 65, -28);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -75; sun.shadow.camera.right = 75;
sun.shadow.camera.top = 75; sun.shadow.camera.bottom = -75;
sun.shadow.camera.far = 220; sun.shadow.bias = -0.0006;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8f2, 0.5);
fill.position.set(-30, 40, 35);
scene.add(fill);

// ---------- procedural textures ----------
function cordCanvas() {
  // per-pixel generation: helical ridges + fiber noise, seamless by construction
  const W = 256, H = 64, period = 32;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const img = g.createImageData(W, H);
  const hash = (x, y) => {
    const s = Math.sin((x % W) * 12.9898 + (y % H) * 78.233) * 43758.5453;
    return s - Math.floor(s);
  };
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      // slant shift at y=H is 0.5 * 64 = 32 = one period, so both axes stay seamless
      const phase = (((x + 0.5 * y) % period) + period) % period / period;
      let v = 0.84 + 0.13 * Math.sin(phase * Math.PI * 2 - Math.PI / 2)
                   + 0.04 * Math.sin(phase * Math.PI * 4);
      v += (hash(x, y) - 0.5) * 0.10;               // fiber speckle
      v += (hash(0, y) - 0.5) * 0.05;               // lengthwise fiber streaks
      const b = Math.max(0, Math.min(255, Math.round(v * 255)));
      const i = (y * W + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = b;
      img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}
const cordSrc = new THREE.CanvasTexture(cordCanvas());
cordSrc.wrapS = cordSrc.wrapT = THREE.RepeatWrapping;
cordSrc.anisotropy = MAXANISO;
cordSrc.colorSpace = THREE.SRGBColorSpace;

function cordTexturePair(len) {
  const map = cordSrc.clone();
  // fine wrap: ridge period ≈ 0.12 world units (8 ridges per tile)
  map.repeat.set(len / 0.96, 1);
  map.needsUpdate = true;
  return map;
}

function paperCanvas() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#f6f4f0'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 26000; i++) {
    const v = 232 + Math.floor(Math.random() * 22);
    g.fillStyle = `rgba(${v},${v - 2},${v - 6},${0.25 + Math.random() * 0.4})`;
    g.fillRect(Math.random() * 512, Math.random() * 512, 1, 1);
  }
  return c;
}
const paperTex = new THREE.CanvasTexture(paperCanvas());
paperTex.wrapS = paperTex.wrapT = THREE.RepeatWrapping;
paperTex.repeat.set(26, 26);
paperTex.anisotropy = MAXANISO;
paperTex.colorSpace = THREE.SRGBColorSpace;

const mat = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ map: paperTex, roughness: 0.96 }));
mat.rotation.x = -Math.PI / 2;
mat.receiveShadow = true;
scene.add(mat);

// shadowbox frame around the piece — from above it reads as the framed artwork
{
  const frameMat = new THREE.MeshStandardMaterial({ color: 0xa9a49b, roughness: 0.62 });
  const T = 2.4, HGT = 7, INNER = 54;
  const beams = [
    [INNER + T / 2, 0, T, (INNER + T) * 2],
    [-(INNER + T / 2), 0, T, (INNER + T) * 2],
    [0, INNER + T / 2, (INNER + T) * 2, T],
    [0, -(INNER + T / 2), (INNER + T) * 2, T],
  ];
  for (const [bx, bz, sx, sz] of beams) {
    const beam = new THREE.Mesh(new THREE.BoxGeometry(sx, HGT, sz), frameMat);
    beam.position.set(bx, HGT / 2, bz);
    beam.castShadow = beam.receiveShadow = true;
    scene.add(beam);
  }
}

// ---------- thread network ----------
const THREAD_R = 0.7;
const STAND_H = THREAD_R - 0.06;
const data = await (await fetch('paths.json')).json();
const S = 100 / data.size;
const hField = (x, z) => 3.4 + 0.9 * Math.sin(0.085 * x + 1.7) * Math.sin(0.065 * z + 0.6);

const edges = [];
const tubeMeshes = [];
for (const e of data.edges) {
  const ctrl = e.pts.map(p => {
    const x = p[0] * S - 50, z = p[1] * S - 50;
    return new THREE.Vector3(x, hField(x, z), z);
  });
  if (ctrl.length < 2) continue;
  const curve = new THREE.CatmullRomCurve3(ctrl, false, 'centripetal', 0.5);
  const n = Math.max(4, Math.ceil(curve.getLength() / 0.5));
  const samples = curve.getSpacedPoints(n);
  samples.forEach(v => { v.y = hField(v.x, v.z); });
  const cum = [0];
  for (let i = 1; i < samples.length; i++)
    cum.push(cum[i - 1] + samples[i].distanceTo(samples[i - 1]));
  const len = cum[cum.length - 1];
  if (len < 2) continue;
  const idx = edges.length;
  edges.push({ color: e.color, samples, cum, len, idx });
  const tubeCurve = new THREE.CatmullRomCurve3(samples, false, 'centripetal', 0.5);
  const tex = cordTexturePair(len);
  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(tubeCurve, Math.max(8, samples.length), THREAD_R, 20),
    new THREE.MeshStandardMaterial({
      color: COLORS[e.color], map: tex, bumpMap: tex, bumpScale: 0.6, roughness: 0.55 }));
  tube.castShadow = true;
  scene.add(tube);
  tubeMeshes.push(tube);
}

// cap thread ends
{
  const capGeo = new THREE.SphereGeometry(THREAD_R * 0.98, 12, 10);
  const byColor = {};
  for (const ed of edges) {
    if (!byColor[ed.color]) byColor[ed.color] = [];
    byColor[ed.color].push(ed.samples[0], ed.samples[ed.samples.length - 1]);
  }
  for (const [color, pts] of Object.entries(byColor)) {
    const im = new THREE.InstancedMesh(capGeo,
      new THREE.MeshStandardMaterial({ color: COLORS[color], map: cordSrc, roughness: 0.62 }), pts.length);
    pts.forEach((p, i) => im.setMatrixAt(i, new THREE.Matrix4().setPosition(p)));
    im.instanceMatrix.needsUpdate = true;
    im.castShadow = true;
    scene.add(im);
  }
}

// spatial hash + nearest-centerline lookup
const CELL = 4;
const grid = new Map();
edges.forEach(ed => ed.samples.forEach((p, i) => {
  const k = `${Math.floor(p.x / CELL)},${Math.floor(p.z / CELL)}`;
  if (!grid.has(k)) grid.set(k, []);
  grid.get(k).push({ e: ed.idx, i });
}));

// closest thread centerline (exact segment projection) within maxLat of (x,z).
// `prefer` biases toward the edge you're already on, so crossings don't steal you.
function surfaceAt(x, z, maxLat, prefer = -1, prefer2 = -1) {
  let best = null, bestScore = Infinity;
  const cx = Math.floor(x / CELL), cz = Math.floor(z / CELL);
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    const cell = grid.get(`${cx + dx},${cz + dz}`);
    if (!cell) continue;
    for (const c of cell) {
      const ed = edges[c.e];
      const i0 = Math.max(0, c.i - 1), i2 = Math.min(ed.samples.length - 1, c.i + 1);
      for (let a = i0; a < i2; a++) {
        const p = ed.samples[a], q = ed.samples[a + 1];
        const abx = q.x - p.x, abz = q.z - p.z;
        const len2 = abx * abx + abz * abz;
        if (len2 < 1e-9) continue;
        let t = ((x - p.x) * abx + (z - p.z) * abz) / len2;
        t = Math.max(0, Math.min(1, t));
        const px = p.x + abx * t, pz = p.z + abz * t;
        const d = Math.hypot(x - px, z - pz);
        const score = d * (c.e === prefer ? 0.6 : c.e === prefer2 ? 0.75 : 1);
        if (d < maxLat && score < bestScore) {
          bestScore = score;
          const il = 1 / Math.sqrt(len2);
          best = { lat: d, e: c.e, y: p.y + (q.y - p.y) * t,
                   tx: abx * il, tz: abz * il, px, pz };
        }
      }
    }
  }
  return best;
}

// ---------- hiker (painted-miniature proportions) ----------
const PAINT = {
  jacket: 0x8f887c, pants: 0x6e675a, boot: 0x39332b, skin: 0xd9a678,
  hat: 0x4a6741, pack: 0x39627e, strap: 0x2e2b26,
};
// the backpack signals which thread you're on (like Steve's mini-figs);
// black gets lifted a touch so the pack still reads against the jacket
const PACK_COLORS = { ...COLORS, black: 0x4a453e };
function pm(color, rough = 0.72) {
  return new THREE.MeshStandardMaterial({ color, roughness: rough });
}
function makeHiker() {
  const g = new THREE.Group();
  const parts = {};
  const legGeo = new THREE.BoxGeometry(0.17, 1.12, 0.22);
  legGeo.translate(0, -0.56, 0);
  const bootGeo = new THREE.BoxGeometry(0.19, 0.14, 0.32);
  bootGeo.translate(0, -1.10, 0.05);
  for (const side of ['L', 'R']) {
    const hip = new THREE.Group();
    hip.position.set(side === 'L' ? -0.15 : 0.15, 1.14, 0);
    const leg = new THREE.Mesh(legGeo, pm(PAINT.pants));
    const boot = new THREE.Mesh(bootGeo, pm(PAINT.boot, 0.85));
    leg.castShadow = boot.castShadow = true;
    hip.add(leg, boot);
    g.add(hip);
    parts['leg' + side] = hip;
  }
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.31, 0.62, 6, 14), pm(PAINT.jacket, 0.66));
  torso.position.y = 1.66; torso.castShadow = true; g.add(torso);
  const armGeo = new THREE.CapsuleGeometry(0.085, 0.62, 4, 10);
  armGeo.translate(0, -0.36, 0);
  for (const side of ['L', 'R']) {
    const shoulder = new THREE.Group();
    shoulder.position.set(side === 'L' ? -0.40 : 0.40, 1.98, 0);
    const arm = new THREE.Mesh(armGeo, pm(PAINT.jacket, 0.66));
    arm.castShadow = true;
    shoulder.add(arm);
    g.add(shoulder);
    parts['arm' + side] = shoulder;
  }
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 18, 14), pm(PAINT.skin, 0.55));
  head.position.y = 2.42; head.castShadow = true; g.add(head);
  const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.37, 0.055, 18), pm(PAINT.hat, 0.8));
  brim.position.y = 2.56; brim.castShadow = true; g.add(brim);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), pm(PAINT.hat, 0.8));
  dome.position.y = 2.56; dome.castShadow = true; g.add(dome);
  const pack = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.66, 0.28), pm(PAINT.pack, 0.8));
  pack.position.set(0, 1.78, -0.42); pack.castShadow = true; g.add(pack);
  parts.pack = pack;
  const roll = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.44, 10), pm(PAINT.strap, 0.85));
  roll.rotation.z = Math.PI / 2;
  roll.position.set(0, 2.18, -0.42); roll.castShadow = true; g.add(roll);
  g.userData = parts;
  return g;
}
const hiker = makeHiker();
scene.add(hiker);

// map marker
const marker = new THREE.Mesh(
  new THREE.SphereGeometry(1.1, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xc9342c }));
marker.visible = false;
scene.add(marker);

// ---------- movement ----------
const WALK = 3.8;
const BACK = 2.6;
const TURN = 2.2;
const TURN_TOUCH = 1.6;   // max stick turn rate, with expo for fine control
const MAXLAT = 0.52;
const STRIDE = 1.6;

const startEdge = edges.find(e => e.color === 'red');
const flip = startEdge.samples[0].x > startEdge.samples[startEdge.samples.length - 1].x;
const sA = flip ? startEdge.samples[startEdge.samples.length - 1] : startEdge.samples[0];
const sB = flip ? startEdge.samples[startEdge.samples.length - 7] : startEdge.samples[6];

const st = {
  pos: new THREE.Vector3(sA.x, sA.y + STAND_H, sA.z),
  yaw: Math.atan2(sB.x - sA.x, sB.z - sA.z),
  speed: 0, walkT: 0,
  onEdge: startEdge.idx, onEdgeTime: 0, lastColored: startEdge.idx,
  blocked: false, crossCooldown: 0,
  crossing: null,
};
function setEdge(e) {
  if (e !== st.onEdge) { st.onEdge = e; st.onEdgeTime = 0; }
  if (edges[e].color !== 'black') st.lastColored = e;
}

// ---------- game mode ----------
let mode = 'title';          // 'title' → 'dive' → 'play'
let diveT = 0;
let mapMode = false;
const splash = document.getElementById('splash');
function beginDive() {
  if (mode === 'title') {
    mode = 'dive'; diveT = 0;
    splash.classList.add('hide');
    document.body.classList.add('playing');
  } else if (mode === 'dive') {
    diveT = 1;   // second press skips the dive
  }
}

// ---------- input ----------
const keys = { fwd: false, back: false, left: false, right: false };
addEventListener('keydown', ev => {
  if (mode !== 'play') { beginDive(); return; }
  const k = ev.key.toLowerCase();
  if (k === 'w' || k === 'arrowup') keys.fwd = true;
  if (k === 's' || k === 'arrowdown') keys.back = true;
  if (k === 'a' || k === 'arrowleft') keys.left = true;
  if (k === 'd' || k === 'arrowright') keys.right = true;
  if (k === 'm') mapMode = !mapMode;
});
addEventListener('keyup', ev => {
  const k = ev.key.toLowerCase();
  if (k === 'w' || k === 'arrowup') keys.fwd = false;
  if (k === 's' || k === 'arrowdown') keys.back = false;
  if (k === 'a' || k === 'arrowleft') keys.left = false;
  if (k === 'd' || k === 'arrowright') keys.right = false;
});

// touch: analog stick (circle within a circle — vertical walks, horizontal turns)
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');
const stick = document.getElementById('stick');
const nub = document.getElementById('nub');
const joy = { x: 0, y: 0, active: false };
let stickPointer = null;
function stickApply(ev) {
  const r = stick.getBoundingClientRect();
  let dx = (ev.clientX - (r.left + r.width / 2)) / (r.width / 2);
  let dy = (ev.clientY - (r.top + r.height / 2)) / (r.height / 2);
  const m = Math.hypot(dx, dy);
  if (m > 1) { dx /= m; dy /= m; }
  joy.x = dx; joy.y = dy; joy.active = true;
  nub.style.transform =
    `translate(calc(-50% + ${dx * r.width * 0.32}px), calc(-50% + ${dy * r.height * 0.32}px))`;
}
function stickClear() {
  stickPointer = null;
  joy.x = joy.y = 0; joy.active = false;
  nub.classList.add('recenter');
  nub.style.transform = 'translate(-50%, -50%)';
  setTimeout(() => nub.classList.remove('recenter'), 180);
}
stick.addEventListener('pointerdown', ev => {
  stickPointer = ev.pointerId;
  try { stick.setPointerCapture(ev.pointerId); } catch {}
  stickApply(ev);
  ev.preventDefault(); ev.stopPropagation();
});
stick.addEventListener('pointermove', ev => { if (ev.pointerId === stickPointer) stickApply(ev); });
stick.addEventListener('pointerup', ev => { if (ev.pointerId === stickPointer) stickClear(); });
stick.addEventListener('pointercancel', ev => { if (ev.pointerId === stickPointer) stickClear(); });

// iOS: swallow double-tap and pinch zoom — an accidental zoom has no way back
let lastTapT = 0;
document.addEventListener('touchend', ev => {
  const now = Date.now();
  if (now - lastTapT < 350) ev.preventDefault();
  lastTapT = now;
}, { passive: false });
document.addEventListener('gesturestart', ev => ev.preventDefault());
document.addEventListener('dblclick', ev => ev.preventDefault());
document.getElementById('mapbtn').addEventListener('pointerdown', ev => {
  if (mode === 'play') mapMode = !mapMode;
  ev.preventDefault(); ev.stopPropagation();
});
addEventListener('pointerdown', () => { if (mode !== 'play') beginDive(); });

// ---------- tilt-shift post pass (the macro-photo look) ----------
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadGeo = new THREE.BufferGeometry();
quadGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), 3));
quadGeo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array([0, 0, 2, 0, 0, 2]), 2));

const blurVert = `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const blurFrag = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D tDiffuse;
  uniform vec2 resolution;
  uniform vec2 dir;
  uniform float focusY;
  uniform float maxBlur;
  uniform float exposure;
  vec3 RRTAndODTFit(vec3 v) {
    vec3 a = v * (v + 0.0245786) - 0.000090537;
    vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081;
    return a / b;
  }
  vec3 aces(vec3 color) {
    const mat3 inM = mat3(
      vec3(0.59719, 0.07600, 0.02840),
      vec3(0.35458, 0.90834, 0.13383),
      vec3(0.04823, 0.01566, 0.83777));
    const mat3 outM = mat3(
      vec3(1.60475, -0.10208, -0.00327),
      vec3(-0.53108, 1.10813, -0.07276),
      vec3(-0.07367, -0.00605, 1.07602));
    color *= exposure / 0.6;
    return clamp(outM * RRTAndODTFit(inM * color), 0.0, 1.0);
  }
  vec3 lin2srgb(vec3 c) {
    return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(vec3(0.0031308), c));
  }
  void main() {
    float r = maxBlur * smoothstep(0.05, 0.40, abs(vUv.y - focusY));
    vec2 px = dir * r / resolution;
    vec3 sum = texture2D(tDiffuse, vUv).rgb * 0.227027;
    sum += (texture2D(tDiffuse, vUv + px * 1.3846154).rgb + texture2D(tDiffuse, vUv - px * 1.3846154).rgb) * 0.3162162;
    sum += (texture2D(tDiffuse, vUv + px * 3.2307692).rgb + texture2D(tDiffuse, vUv - px * 3.2307692).rgb) * 0.0702703;
    #ifdef FINAL_PASS
      sum = lin2srgb(aces(sum));
    #endif
    gl_FragColor = vec4(sum, 1.0);
  }`;
function blurMaterial(finalPass) {
  return new THREE.ShaderMaterial({
    vertexShader: blurVert,
    fragmentShader: blurFrag,
    defines: finalPass ? { FINAL_PASS: 1 } : {},
    uniforms: {
      tDiffuse: { value: null },
      resolution: { value: new THREE.Vector2(1, 1) },
      dir: { value: new THREE.Vector2(finalPass ? 0 : 1, finalPass ? 1 : 0) },
      focusY: { value: 0.5 },
      maxBlur: { value: 0 },
      exposure: { value: 1.2 },
    },
    depthTest: false, depthWrite: false,
  });
}
const blurH = blurMaterial(false);
const blurV = blurMaterial(true);
const quad = new THREE.Mesh(quadGeo, blurH);
quad.frustumCulled = false;
postScene.add(quad);

let rtScene = null, rtBlur = null;
function makeTargets() {
  const w = Math.floor(innerWidth * renderer.getPixelRatio());
  const h = Math.floor(innerHeight * renderer.getPixelRatio());
  rtScene?.dispose(); rtBlur?.dispose();
  rtScene = new THREE.WebGLRenderTarget(w, h, { samples: 4, type: THREE.HalfFloatType });
  rtBlur = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType });
  blurH.uniforms.resolution.value.set(w, h);
  blurV.uniforms.resolution.value.set(w, h);
}
makeTargets();

const post = { focusY: 0.5, maxBlur: 0 };   // eased toward per-mode targets
function render() {
  blurH.uniforms.focusY.value = blurV.uniforms.focusY.value = post.focusY;
  blurH.uniforms.maxBlur.value = blurV.uniforms.maxBlur.value = post.maxBlur;
  renderer.setRenderTarget(rtScene);
  renderer.render(scene, camera);
  quad.material = blurH;
  blurH.uniforms.tDiffuse.value = rtScene.texture;
  renderer.setRenderTarget(rtBlur);
  renderer.render(postScene, postCam);
  quad.material = blurV;
  blurV.uniforms.tDiffuse.value = rtBlur.texture;
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
}

// ---------- main loop ----------
const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
const packTarget = new THREE.Color();
const camPos = new THREE.Vector3(), camTarget = new THREE.Vector3();
const smoothLook = new THREE.Vector3();
const diveFrom = new THREE.Vector3(0, 105, 0.01);
const diveMid = new THREE.Vector3();
const diveLook = new THREE.Vector3();
const camRay = new THREE.Raycaster();
let camInit = false;
const clock = new THREE.Clock();

window.POC = { st, keys, joy, edges, surfaceAt,
  get mapMode() { return mapMode; }, set mapMode(v) { mapMode = v; },
  get mode() { return mode; },
  begin: beginDive,
  skipIntro() { mode = 'play'; splash.classList.add('hide'); document.body.classList.add('playing'); },
  step(seconds) {
    const n = Math.round(seconds * 60);
    for (let i = 0; i < n; i++) update(1 / 60);
    render();
  } };

function update(dt) {
  const inPlay = mode === 'play';
  let sp = 0;
  if (inPlay) {
    if (keys.left) st.yaw += TURN * dt;
    if (keys.right) st.yaw -= TURN * dt;
    if (joy.active) st.yaw -= joy.x * Math.abs(joy.x) * TURN_TOUCH * dt;
  }
  const fx = Math.sin(st.yaw), fz = Math.cos(st.yaw);

  if (inPlay) {
    let want = keys.fwd ? WALK : (keys.back ? -BACK : 0);
    if (joy.active && Math.abs(joy.y) > 0.15)
      want = -joy.y * (joy.y < 0 ? WALK : BACK);   // analog: partial deflection walks slower
    st.speed += (want - st.speed) * Math.min(1, dt * 8);
    sp = Math.abs(st.speed) < 0.05 ? 0 : st.speed;
  } else st.speed = 0;
  st.blocked = false;
  st.onEdgeTime += dt;

  function applyCarry(t, along) {
    if (keys.left || keys.right || (joy.active && Math.abs(joy.x) > 0.15) ||
        st.onEdgeTime <= 0.5 || t.e !== st.onEdge) return;
    const sgn = along < 0 ? -1 : 1;
    const targetYaw = Math.atan2(t.tx * sgn, t.tz * sgn);
    let dy = ((targetYaw - st.yaw + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    st.yaw += Math.max(-3.0 * dt, Math.min(3.0 * dt, dy));
  }

  if (inPlay && st.crossing) {
    const c = st.crossing;
    const step = Math.max(Math.abs(sp), 2.6) * dt;
    st.pos.x += c.dirX * step;
    st.pos.z += c.dirZ * step;
    st.pos.y += (c.targetY - st.pos.y) * Math.min(1, dt * 10);
    c.traveled += step;
    st.walkT += step;
    const here = surfaceAt(st.pos.x, st.pos.z, MAXLAT);
    if (here && c.traveled > c.minTravel) {
      st.pos.y = here.y + STAND_H;
      setEdge(here.e);
      st.crossing = null;
      st.crossCooldown = 0.55;   // a landing beat: control returns to the player
    } else if (c.traveled > c.maxTravel) {
      st.crossing = null;
    }
  } else if (inPlay && sp !== 0) {
    const nx = st.pos.x + fx * sp * dt;
    const nz = st.pos.z + fz * sp * dt;
    const surf = surfaceAt(nx, nz, MAXLAT, st.onEdge, st.lastColored);
    if (surf) {
      st.pos.set(nx, surf.y + STAND_H, nz);
      setEdge(surf.e);
      applyCarry(surf, fx * surf.tx + fz * surf.tz);
      st.walkT += Math.abs(sp) * dt;
    } else {
      const cur = surfaceAt(st.pos.x, st.pos.z, MAXLAT + 0.3, st.onEdge, st.lastColored);
      const along = cur ? fx * cur.tx + fz * cur.tz : 0;
      let moved = false;
      if (cur && Math.abs(along) > 0.45) {
        applyCarry(cur, along);
        const pull = Math.min(1, dt * 4);
        const sx = st.pos.x + cur.tx * along * sp * dt + (cur.px - st.pos.x) * pull;
        const sz = st.pos.z + cur.tz * along * sp * dt + (cur.pz - st.pos.z) * pull;
        const surf2 = surfaceAt(sx, sz, MAXLAT, st.onEdge, st.lastColored);
        if (surf2) {
          st.pos.set(sx, surf2.y + STAND_H, sz);
          setEdge(surf2.e);
          st.walkT += Math.abs(sp * along) * dt;
          moved = true;
        }
      }
      if (!moved && (!cur || Math.abs(along) <= 0.45) && st.crossCooldown <= 0) {
        const sgn = sp < 0 ? -1 : 1;
        const dx = fx * sgn, dz = fz * sgn;
        for (const d of [0.6, 0.9, 1.2, 1.5, 1.8, 2.1]) {
          const s = surfaceAt(st.pos.x + dx * d, st.pos.z + dz * d, MAXLAT * 0.9);
          if (s) {
            st.crossing = { dirX: dx, dirZ: dz, targetY: s.y + STAND_H,
                            traveled: 0, minTravel: d * 0.5, maxTravel: d + 0.8 };
            break;
          }
        }
        if (!st.crossing) st.blocked = true;
      } else if (!moved) st.blocked = true;
    }
  }

  if (st.crossCooldown > 0) st.crossCooldown -= dt;

  // the backpack tells you which thread you're on
  packTarget.setHex(PACK_COLORS[edges[st.onEdge].color]);
  hiker.userData.pack.material.color.lerp(packTarget, Math.min(1, dt * 6));

  // hiker pose
  hiker.position.copy(st.pos);
  hiker.lookAt(st.pos.x + fx, st.pos.y, st.pos.z + fz);
  const P = hiker.userData;
  const moving = inPlay && (st.crossing || (sp !== 0 && !st.blocked));
  if (moving) {
    const phase = (st.walkT / STRIDE) * Math.PI * 2;
    const swing = Math.sin(phase) * 0.52;
    P.legL.rotation.x = swing;
    P.legR.rotation.x = -swing;
    P.armL.rotation.x = -swing * 0.55;
    P.armR.rotation.x = swing * 0.55;
    hiker.rotation.x += 0.05;
    hiker.position.y += Math.abs(Math.sin(phase)) * 0.045;
  } else {
    P.legL.rotation.x *= 0.82; P.legR.rotation.x *= 0.82;
    P.armL.rotation.x *= 0.82; P.armR.rotation.x *= 0.82;
  }

  // camera + focus
  marker.visible = inPlay && mapMode;
  if (mode === 'title') {
    camera.position.copy(diveFrom);
    camera.lookAt(0, 0, 0);
    smoothLook.set(0, 0, 0);
    post.focusY = 0.5;
    post.maxBlur = 0;          // the artwork shows crisp; blur arrives with the dive
  } else if (mode === 'dive') {
    diveT = Math.min(1, diveT + dt / 4.2);
    const s = diveT * diveT * (3 - 2 * diveT);
    tmp.set(st.pos.x - fx * 9.4, st.pos.y + 4.4, st.pos.z - fz * 9.4);          // chase pos
    tmp2.set(st.pos.x + fx * 5.5, st.pos.y + 2.0, st.pos.z + fz * 5.5);         // chase look
    diveMid.set((diveFrom.x + tmp.x) / 2 + 20, 46, (diveFrom.z + tmp.z) / 2 + 12);
    const a = 1 - s;
    camera.position.set(
      a * a * diveFrom.x + 2 * a * s * diveMid.x + s * s * tmp.x,
      a * a * diveFrom.y + 2 * a * s * diveMid.y + s * s * tmp.y,
      a * a * diveFrom.z + 2 * a * s * diveMid.z + s * s * tmp.z);
    diveLook.set(0, 0, 0).lerp(tmp2, s);
    camera.lookAt(diveLook);
    post.focusY = 0.5 + (0.40 - 0.5) * s;   // tilt-shift fades in as we descend
    post.maxBlur = 3.2 * s;
    if (diveT >= 1) {
      mode = 'play';
      camera.position.copy(tmp);
      smoothLook.copy(tmp2);
      camInit = true;
    }
  } else if (mapMode) {
    marker.position.copy(st.pos).add(tmp.set(0, 4 + Math.sin(performance.now() * 0.005) * 0.8, 0));
    const sc = 1 + 0.25 * Math.sin(performance.now() * 0.005);
    marker.scale.set(sc, sc, sc);
    camPos.set(0, 105, 0.01); camTarget.set(0, 0, 0);
    const k = 1 - Math.exp(-dt * 2.2);
    camera.position.lerp(camPos, k);
    smoothLook.lerp(camTarget, k);
    camera.lookAt(smoothLook);
    post.focusY += (0.5 - post.focusY) * Math.min(1, dt * 3);
    post.maxBlur += (0 - post.maxBlur) * Math.min(1, dt * 3);   // map stays readable
  } else {
    camPos.set(st.pos.x - fx * 9.4, st.pos.y + 4.4, st.pos.z - fz * 9.4);
    camTarget.set(st.pos.x + fx * 5.5, st.pos.y + 2.0, st.pos.z + fz * 5.5);
    tmp2.set(st.pos.x, st.pos.y + 2.0, st.pos.z);
    const dirv = tmp.subVectors(camPos, tmp2);
    const dist = dirv.length();
    dirv.normalize();
    camRay.set(tmp2, dirv);
    camRay.far = dist;
    const hits = camRay.intersectObjects(tubeMeshes, false);
    if (hits.length)
      camPos.copy(tmp2).addScaledVector(dirv, Math.max(2.0, hits[0].distance - 0.6));
    if (!camInit) { camera.position.copy(camPos); smoothLook.copy(camTarget); camInit = true; }
    const k = 1 - Math.exp(-dt * 5);
    camera.position.lerp(camPos, k);
    smoothLook.lerp(camTarget, k);
    camera.lookAt(smoothLook);
    post.focusY += (0.40 - post.focusY) * Math.min(1, dt * 2);
    post.maxBlur += (3.2 - post.maxBlur) * Math.min(1, dt * 2);
  }
}

function frame() {
  requestAnimationFrame(frame);
  update(Math.min(clock.getDelta(), 0.05));
  render();
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  makeTargets();
});
</script>
</body>
</html>
